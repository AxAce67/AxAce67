# Rebuilds the activity and language cards (tools/stats.py) once a day and
# commits them when they changed. Uses only the built-in GITHUB_TOKEN.
name: stats

on:
  schedule:
    - cron: "15 15 * * *" # 00:15 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/stats.py, .github/workflows/stats.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cards
        run: python3 tools/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git add assets
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update stats cards"
          git push
